<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #ffffff;
      font-family: 'Montserrat', sans-serif;
    }

    .logo-wrap {
      animation: pulse 2s ease-in-out infinite;
      transform-origin: center;
      outline: none;
    }

    @keyframes pulse {
      0%,100% { transform: scale(1);    opacity: 1;    }
      50%      { transform: scale(1.1); opacity: 0.65; }
    }

    .logo-wrap svg {
      width: 140px;
      height: 140px;
    }

    .label {
      margin-top: 24px;
      font-size: 13px;
      color: #3C3C3B;
      letter-spacing: 0.03em;
    }

    .done .logo-wrap {
      animation: shrink 0.4s ease-in forwards;
    }

    @keyframes shrink {
      to { transform: scale(0.5); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="logo-wrap" tabindex="-1">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="url(#g)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
          <stop offset="0"  stop-color="#447fb4"/>
          <stop offset="1"  stop-color="#32b5ae"/>
        </linearGradient>
      </defs>
      <path d="M4 5m0 2a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z"/>
      <path d="M16 3l0 4"/>
      <path d="M8 3l0 4"/>
      <path d="M4 11l16 0"/>
      <path fill="url(#g)" stroke="none" d="M8 15h2v2h-2z"/>
    </svg>
  </div>

  <p class="label">Loading capacity data…</p>

  <script>
    document.querySelector('.logo-wrap').focus();
    google.script.run
      .withSuccessHandler(function() {
        document.body.classList.add('done');
        setTimeout(function() { google.script.host.close(); }, 420);
      })
      .withFailureHandler(function(err) {
        document.querySelector('.label').textContent = '⚠️ ' + err.message;
      })
      .doRefresh(true);
  </script>

</body>
</html>
